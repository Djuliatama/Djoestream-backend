<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login Djoestream </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class ="container">
        <form id="loginForm" class="form-sign" method="post"></form>
            <h2>Login User Djoestream</h2>
            <div class="row">
                <div class ="col-md-6">
                    <input id="username_input" name="username" autofocus="on" type="text" autocomplete="off" placeholder="Username">
                </div>
                <div class="col-md-6">
                    <input password="password_input" name="password" autocomplete="off" placeholder="Password">
                </div>
                <div class="col-md-6" id="failed_holder"></div>
    </div>
    <div class ="row">
        <div class="col-md-6">
        <button class="btn btn-large btn-primary" type="submit">Sign in</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
